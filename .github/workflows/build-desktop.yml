name: Build Desktop

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish stable desktop-version.json release assets"
        required: true
        type: boolean
        default: false
      release_channel:
        description: "Release channel. Only stable can update desktop-latest."
        required: true
        type: choice
        default: qa
        options:
          - qa
          - stable

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"

permissions:
  contents: read

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SPIKE: platform builds replaced with dummy artifacts; publish job unchanged.
  macos:
    runs-on: ubuntu-latest
    outputs:
      has_signing_secrets: "false"
    steps:
      - run: "true"
  linux:
    runs-on: ubuntu-latest
    steps:
      - run: "true"
  windows:
    runs-on: ubuntu-latest
    outputs:
      has_signing_secrets: "false"
    steps:
      - run: "true"

  publish:
    name: Publish stable desktop release
    needs:
      - macos
      - linux
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The plan runs before the downloads: a qa or publish=false run has no use
      # for several hundred MB of binaries it will never upload.
      - name: Plan release publication
        id: release_plan
        env:
          HAS_SIGNING_SECRETS: ${{ needs.macos.outputs.has_signing_secrets }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          IS_PRERELEASE="false"
          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE="true"
          fi

          SHOULD_PUBLISH="false"
          if [[ "$INPUT_PUBLISH" == "true" && "$RELEASE_CHANNEL" == "stable" && "$IS_PRERELEASE" == "false" ]]; then
            SHOULD_PUBLISH="true"
          fi

          # Linux AppImages have no notarization equivalent and an unsigned
          # Windows installer still runs, so both publish on their own. Only
          # the macOS binaries wait on the Apple secrets.
          PUBLISH_MACOS_BINARIES="false"
          if [[ "$HAS_SIGNING_SECRETS" == "true" ]]; then
            PUBLISH_MACOS_BINARIES="true"
          elif [[ "$SHOULD_PUBLISH" == "true" ]]; then
            echo "::warning::macOS signing/notarization secrets are missing; publishing the version feeds, the Linux AppImage, and the Windows installer, and withholding unsigned .dmg/.zip artifacts."
          fi

          {
            echo "version=$VERSION"
            echo "is_prerelease=$IS_PRERELEASE"
            echo "should_publish=$SHOULD_PUBLISH"
            echo "publish_macos_binaries=$PUBLISH_MACOS_BINARIES"
          } >> "$GITHUB_OUTPUT"

      # SPIKE: account artifact quota is full, so write dummy assets locally.
      - name: Create dummy desktop artifacts
        if: steps.release_plan.outputs.should_publish == 'true'
        run: |
          mkdir -p release/macos release/linux release/windows
          echo '{}' > release/macos/desktop-version.json
          echo '{}' > release/linux/desktop-version-linux.json; echo x > release/linux/latest-linux.yml; echo x > release/linux/bb-x64.AppImage
          echo '{}' > release/windows/desktop-version-windows.json; echo x > release/windows/latest.yml; echo x > release/windows/bb-setup.exe; echo x > release/windows/bb-setup.exe.blockmap

      - name: Publish stable desktop release feed
        if: steps.release_plan.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_plan.outputs.version }}
          PUBLISH_MACOS_BINARIES: ${{ steps.release_plan.outputs.publish_macos_binaries }}
        run: |
          set -euo pipefail

          VERSION_TAG="desktop-v${VERSION}"
          LATEST_TAG="desktop-latest"
          MACOS_DIR="release/macos"
          LINUX_DIR="release/linux"
          WINDOWS_DIR="release/windows"

          RELEASE_ASSETS=()

          # An unmatched glob would otherwise reach gh as a literal pattern and
          # fail the upload, so each expansion states whether it is required.
          add_required_glob() {
            local matches=("$@")
            if [[ ! -e "${matches[0]}" ]]; then
              echo "::error::No release artifact matched ${matches[0]}."
              exit 1
            fi
            RELEASE_ASSETS+=("${matches[@]}")
          }

          add_optional_glob() {
            local matches=("$@")
            if [[ -e "${matches[0]}" ]]; then
              RELEASE_ASSETS+=("${matches[@]}")
            fi
          }

          # Every platform resets the same moving release, so a single job
          # assembles every asset. Splitting the reset across platform jobs
          # would let whichever finished last delete the others' binaries.
          add_required_glob "$MACOS_DIR/desktop-version.json"
          add_required_glob "$LINUX_DIR/desktop-version-linux.json"
          add_required_glob "$LINUX_DIR/latest-linux.yml"
          add_required_glob "$LINUX_DIR"/*.AppImage
          # AppImage embeds its block map, so a sidecar file is not guaranteed.
          add_optional_glob "$LINUX_DIR"/*.blockmap
          # The Windows installer runs unsigned behind a SmartScreen warning,
          # so it publishes whether or not signing secrets are configured.
          add_required_glob "$WINDOWS_DIR/desktop-version-windows.json"
          add_required_glob "$WINDOWS_DIR/latest.yml"
          add_required_glob "$WINDOWS_DIR"/*.exe
          add_required_glob "$WINDOWS_DIR"/*.blockmap

          if [[ "$PUBLISH_MACOS_BINARIES" == "true" ]]; then
            add_required_glob "$MACOS_DIR/latest-mac.yml"
            add_required_glob "$MACOS_DIR"/*.dmg
            add_required_glob "$MACOS_DIR"/*.zip
            add_required_glob "$MACOS_DIR"/*.blockmap
          else
            echo "Signing/notarization gate is closed; publishing the macOS version feed without macOS binaries."
          fi

          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "Release $VERSION_TAG already exists; refusing to mutate immutable desktop release."
            exit 1
          fi

          # Notes that land after the release reach it through release-notes.yml.
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          if ! node scripts/release-notes.mjs "$VERSION" > "$NOTES_FILE"; then
            echo "::warning::CHANGELOG.md has no ${VERSION} section; release-notes.yml fills the notes when it lands."
            echo "bb desktop ${VERSION}" > "$NOTES_FILE"
          fi

          gh release create "$VERSION_TAG" "${RELEASE_ASSETS[@]}" \
            --target "$GITHUB_SHA" \
            --title "bb desktop ${VERSION}" \
            --notes-file "$NOTES_FILE" \
            --latest

          git tag -f "$LATEST_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/${LATEST_TAG}"

          if gh release view "$LATEST_TAG" >/dev/null 2>&1; then
            gh release edit "$LATEST_TAG" \
              --target "$GITHUB_SHA" \
              --title "bb desktop latest" \
              --notes "Latest stable bb desktop release metadata." \
              --latest=false

            # desktop-latest is a moving release, but --clobber only replaces
            # assets with matching names. Preserve the release page and reset
            # assets in-place so versioned binaries cannot accumulate and
            # JSON-only publishes cannot leave stale binaries from an older
            # signed release.
            gh release view "$LATEST_TAG" --json assets --jq '.assets[].name' | while IFS= read -r asset_name; do
              if [[ -n "$asset_name" ]]; then
                gh release delete-asset "$LATEST_TAG" "$asset_name" --yes
              fi
            done

            gh release upload "$LATEST_TAG" "${RELEASE_ASSETS[@]}"
          else
            gh release create "$LATEST_TAG" "${RELEASE_ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "bb desktop latest" \
              --notes "Latest stable bb desktop release metadata." \
              --latest=false
          fi

      - name: Summarize
        env:
          HAS_WINDOWS_SIGNING_SECRETS: ${{ needs.windows.outputs.has_signing_secrets }}
          IS_PRERELEASE: ${{ steps.release_plan.outputs.is_prerelease }}
          PUBLISH_MACOS_BINARIES: ${{ steps.release_plan.outputs.publish_macos_binaries }}
          SHOULD_PUBLISH: ${{ steps.release_plan.outputs.should_publish }}
          VERSION: ${{ steps.release_plan.outputs.version }}
        run: |
          {
            echo "## bb desktop artifacts"
            echo
            echo "- arm64 macOS .dmg, .zip, latest-mac.yml, and desktop-version.json uploaded as workflow artifacts"
            echo "- x64 Linux .AppImage, latest-linux.yml, and desktop-version-linux.json uploaded as workflow artifacts"
            echo "- x64 Windows .exe installer, latest.yml, and desktop-version-windows.json uploaded as workflow artifacts"
            echo "- version: ${VERSION}"
            echo "- prerelease version: ${IS_PRERELEASE}"
            echo "- stable release publication requested and allowed: ${SHOULD_PUBLISH}"
            echo "- macOS release binary upload enabled: ${PUBLISH_MACOS_BINARIES}"
            echo "- macOS feed URL: https://github.com/get-bb/bb/releases/download/desktop-latest/desktop-version.json"
            echo "- Windows installer signed: ${HAS_WINDOWS_SIGNING_SECRETS}"
            echo "- Linux feed URL: https://github.com/get-bb/bb/releases/download/desktop-latest/desktop-version-linux.json"
            echo "- Windows feed URL: https://github.com/get-bb/bb/releases/download/desktop-latest/desktop-version-windows.json"
          } >> "$GITHUB_STEP_SUMMARY"
